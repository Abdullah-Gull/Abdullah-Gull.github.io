<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellerBoard AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f1115; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .amazon-orange { color: #FF9900; }
        .bg-amazon-dark { background-color: #131921; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="flex flex-col items-center mb-6">
        <div class="bg-black text-white px-6 py-2 rounded-full text-xs font-bold flex items-center gap-2 border border-gray-800 shadow-lg cursor-pointer">
            <span class="w-2 h-2 bg-green-500 rounded-full inline-block animate-pulse"></span>
            SellerBoard Live Feed
            <span class="amazon-orange">🔥</span>
        </div>
    </div>

    <div class="max-w-4xl mx-auto flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight">SellerBoard AI</h1>
            <p class="text-[10px] text-blue-500 font-bold tracking-wider">CONNECTED: AMAZON US</p>
        </div>
        <div class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center">
            <span class="amazon-orange text-lg">🏪</span>
        </div>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-gray-400 font-medium">Total Sales (Revenue)</p>
            <h3 class="text-2xl font-bold mt-1 text-white">$4,290.00</h3>
            <p class="text-[11px] amazon-orange font-semibold mt-2">30 units bika</p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-gray-400 font-medium">Net Profit (After Expenses)</p>
            <h3 class="text-2xl font-bold mt-1 text-green-500">$1,180.00</h3>
            <p class="text-[11px] text-gray-400 font-semibold mt-2">ROI: <span class="text-green-400">27.5%</span></p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-gray-400 font-medium">Profit Margin Percent</p>
            <h3 class="text-2xl font-bold mt-1 text-cyan-400">14.2%</h3>
            <p class="text-[11px] text-gray-500 font-semibold mt-2">Estimated target margin</p>
        </div>
    </div>

    <div class="max-w-4xl mx-auto mt-8 bg-zinc-900/50 border border-dashed border-zinc-800 rounded-2xl p-6 text-center">
        <p class="text-sm text-zinc-400">Secure link with SP-API is active.</p>
    </div>

</body>
</html>
