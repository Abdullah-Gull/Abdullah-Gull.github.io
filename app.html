<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon AI Agent</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
        textarea { width: 100%; height: 150px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #ff9900; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #output { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; border: 1px solid #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Amazon Listing Optimizer Agent</h2>
    <textarea id="userInput" placeholder="Product ka description ya features yahan likhein..."></textarea>
    <button onclick="runAgent()">Analyze with AI</button>

    <div id="output">Result yahan show hoga...</div>

    <script>
        // Yahan apni API KEY daalein
        const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 

        async function runAgent() {
            const input = document.getElementById("userInput").value;
            const outputDiv = document.getElementById("output");
            outputDiv.innerText = "Agent kaam kar raha hai...";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Tum Amazon Expert ho. Is product ko analyze karo aur SEO-friendly title aur 5 bullet points likho: " + input }] }]
                    })
                });

                const data = await response.json();
                outputDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (error) {
                outputDiv.innerText = "Error: API Key check karein ya internet connection.";
            }
        }
    </script>
</body>
</html>
