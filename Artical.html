<!-- Automatic Counter Logic and Viewport Observer Trigger -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const counters = document.querySelectorAll('.stat-number');
    const speed = 60; // Lower number means faster speed counting adjustment

    const startCounter = (counter) => {
      const target = +counter.getAttribute('data-target');
      const count = +counter.innerText;
      const increment = Math.ceil(target / speed);

      if (count < target) {
        counter.innerText = count + increment > target ? target : count + increment;
        setTimeout(() => startCounter(counter), 25);
      } else {
        counter.innerText = target;
      }
    };

    // Trigger calculation when the dashboard rolls onto screen viewport boundaries
    const statsSection = document.getElementById('results-dashboard');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          counters.forEach(counter => startCounter(counter));
          observer.unobserve(entry.target); // Trigger count up exactly once
        }
      });
    }, { threshold: 0.2 });

    if (statsSection) {
      observer.observe(statsSection);
    }
  });
</script>
