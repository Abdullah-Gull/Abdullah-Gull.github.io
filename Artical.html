<!-- High-Speed Counter Automation Logic with High Frame-Rate Optimization -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const counterElements = document.querySelectorAll('.premium-counter');
    const animationDuration = 1000; // Complete target count animation within exactly 1 second

    const animateCounter = (element) => {
      const targetValue = +element.getAttribute('data-target');
      const startTime = performance.now();

      const updateFrame = (currentTime) => {
        const elapsedTime = currentTime - startTime;
        const progressRatio = Math.min(elapsedTime / animationDuration, 1);
        
        // Quad-Out easing function for ultra smooth deceleration velocity look
        const easeProgress = progressRatio * (2 - progressRatio);
        const currentCount = Math.floor(easeProgress * targetValue);

        element.innerText = currentCount;

        if (progressRatio < 1) {
          requestAnimationFrame(updateFrame);
        } else {
          element.innerText = targetValue;
        }
      };

      requestAnimationFrame(updateFrame);
    };

    // Initialize Intersection Observer to trigger right upon precise view entry bounds
    const observerOptions = { threshold: 0.15, rootMargin: "0px 0px -50px 0px" };
    const viewportObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          counterElements.forEach(el => animateCounter(el));
          viewportObserver.unobserve(entry.target);
        }
      });
    }, observerOptions);

    const masterTargetSection = document.getElementById('results-premium-architecture');
    if (masterTargetSection) {
      viewportObserver.observe(masterTargetSection);
    }
  });
</script>
