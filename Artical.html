<script src="https://cdn.tailwindcss.com"></script>
<!-- Replace your current header with this exact code -->
<header class="bg-[#050505] w-full relative z-50 border-b border-zinc-800" x-data="{ open: false }">
  
  <!-- Top Row: Logo & Yellow/Orange Hamburger (Like Steven Pope) -->
  <div class="flex justify-between items-center px-4 py-3">
    
    <!-- Logo Area -->
    <div class="flex items-center gap-2">
      <!-- Aap chaho toh apni picture yahan laga sakte ho -->
      <div class="w-8 h-8 rounded-full bg-[#FF9900] flex items-center justify-center text-black font-bold text-xs">AG</div>
      <span class="text-white font-bold text-xl tracking-tight">Abdullah Gull</span>
    </div>

    <!-- Hamburger Icon in Orange Circle -->
    <button @click="open = !open" class="bg-[#FF9900] text-black w-11 h-11 flex items-center justify-center rounded-full shadow-lg">
      <!-- 3 Lines Icon -->
      <svg x-show="!open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      <!-- Cross Icon -->
      <svg x-show="open" style="display: none;" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>

  <!-- Second Row: Quick Links (Fast quote & Contact Us jaisa) -->
  <div class="flex gap-6 px-4 pb-4 text-white font-semibold text-md">
    <a href="#" class="hover:text-[#FF9900]">Free Audit</a>
    <a href="#" class="hover:text-[#FF9900]">Contact Us</a>
  </div>

  <!-- Mobile Dropdown Menu (Click karne par open hoga) -->
  <div x-show="open" 
       style="display: none;"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       class="absolute top-full left-0 w-full bg-[#111] border-b border-zinc-800 flex flex-col shadow-2xl">
    <a href="#" class="text-white p-4 border-b border-zinc-800 hover:bg-[#FF9900] hover:text-black transition-all">Home</a>
    <a href="#" class="text-white p-4 border-b border-zinc-800 hover:bg-[#FF9900] hover:text-black transition-all">About Us</a>
    <a href="#" class="text-white p-4 border-b border-zinc-800 hover:bg-[#FF9900] hover:text-black transition-all">Services</a>
    <a href="#" class="text-white p-4 hover:bg-[#FF9900] hover:text-black transition-all">Blog</a>
  </div>

</header>
