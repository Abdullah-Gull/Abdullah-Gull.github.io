<!-- Zero Lag Dynamic Matrix Counter Logic Execution Scripts -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const dashboardElements = document.querySelectorAll('.vibrant-counter');
    const animationLength = 1200; // Fast precise render execution timeframe loop

    const playCounterAnimation = (element) => {
      const ceilingValue = +element.getAttribute('data-target');
      const timeOrigin = performance.now();

      const processRenderFrame = (timestamp) => {
        const structuralDelta = timestamp - timeOrigin;
        const completeRatio = Math.min(structuralDelta / animationLength, 1);
        
        // Dynamic Cubic Deceleration Curve Mechanics
        const deceleratedEasedValue = 1 - Math.pow(1 - completeRatio, 3);
        const computationalOutput = Math.floor(deceleratedEasedValue * ceilingValue);

        element.innerText = computationalOutput;

        if (completeRatio < 1) {
          requestAnimationFrame(processRenderFrame);
        } else {
          element.innerText = ceilingValue;
        }
      };

      requestAnimationFrame(processRenderFrame);
    };

    // Optimization Observer Module Bounds Setup
    const setupObserverOptions = { threshold: 0.20 };
    const viewportGridObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          dashboardElements.forEach(item => playCounterAnimation(item));
          viewportGridObserver.unobserve(entry.target);
        }
      });
    }, setupObserverOptions);

    const masterComponentNode = document.getElementById('premium-results-split');
    if (masterComponentNode) {
      viewportGridObserver.observe(masterComponentNode);
    }
  });
</script>
