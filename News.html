<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aapka Title - Modern Page</title>
    
    <!-- Tailwind CSS CDN for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0a0a0a',
                        primary: {
                            100: '#ededed',
                            12: 'rgba(255, 255, 255, 0.12)',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Minimalist Styles -->
    <style>
        :root {
            --document-width: 100dvw;
            --gutter-size: max(20px, calc((var(--document-width) - 68rem) / 2));
        }
        body {
            background-color: #0a0a0a;
            color: #ededed;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-background text-primary-100 antialiased selection:bg-white selection:text-black">

    <!-- Header / Navigation -->
    <header class="w-full border-b border-white/10 py-4 px-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="font-bold tracking-wider text-lg">BrandName</div>
        <nav class="space-x-6 text-sm text-gray-400">
            <a href="#" class="hover:text-white transition">Research</a>
            <a href="#" class="hover:text-white transition">Product</a>
            <a href="#" class="hover:text-white transition">Company</a>
        </nav>
    </header>

    <!-- Hero Section (OpenAI Style) -->
    <main class="max-w-4xl mx-auto px-6 py-20 text-center">
        <div class="inline-block mb-4 px-3 py-1 text-xs font-medium rounded-full bg-white/10 border border-white/20 text-gray-300">
            Announcing Version 2.0
        </div>
        <h1 class="text-4xl md:text-6xl font-semibold tracking-tight mb-6">
            A new generation of intelligent web design.
        </h1>
        <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">
            Experience lightning-fast performance, minimalist typography, and seamless layout structures built for modern web standards.
        </p>
        <div class="flex justify-center gap-4">
            <button class="bg-white text-black font-medium px-6 py-3 rounded-full hover:bg-gray-200 transition">
                Get Started
            </button>
            <button class="border border-white/20 px-6 py-3 rounded-full hover:bg-white/5 transition">
                View on GitHub
            </button>
        </div>
    </main>

</body>
</html>
