<link rel="icon" id="f">
<script>
  function updateFavicon() {
    let isOnline = document.visibilityState === 'visible';
    let bgColor = isOnline ? '%232ec4b6' : '%23888888'; // Active = Green (#2ec4b6), Inactive = Grey (#888888)
    let imgUrl = 'https://abdullah-gull.github.io/images/Abdullah-Gull-Portrait-Banner.jpg.png';
    
    // SVG background ke sath aapki transparent PNG image ko combine karega
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
      <rect width="64" height="64" rx="10" fill="${bgColor}"/>
      <image href="${imgUrl}" width="64" height="64"/>
    </svg>`;
    
    document.getElementById('f').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  document.addEventListener('visibilitychange', updateFavicon);
  updateFavicon(); // Initial run
</script>
