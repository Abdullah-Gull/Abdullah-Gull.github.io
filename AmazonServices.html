<link rel="icon" id="dyn-fav" href="https://abdullah-gull.github.io/images/new-facon.jpg.png">
<script>
  const imgUrl = "https://abdullah-gull.github.io/images/new-facon.jpg.png";
  function setFav(bg) {
    let c = document.createElement('canvas'); c.width = c.height = 64;
    let ctx = c.getContext('2d'), img = new Image();
    img.crossOrigin = "Anonymous"; img.src = imgUrl;
    img.onload = () => {
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 64, 64);
      ctx.drawImage(img, 4, 4, 56, 56);
      document.getElementById('dyn-fav').href = c.toDataURL();
    };
  }
  const checkVis = () => setFav(document.visibilityState === 'visible' ? '#2ec4b6' : '#888888');
  document.addEventListener('visibilitychange', checkVis);
  checkVis();
</script>
