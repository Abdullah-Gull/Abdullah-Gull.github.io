<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Image Background Tab Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
      background-color: #f0f2f5; 
    }

    /* Image Box - Default (Offline / Grey Background) */
    .image-box {
      display: inline-block;
      padding: 15px;
      background-color: #cccccc; /* Grey Background */
      border-radius: 12px;
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Jab user tab par ho (Online / Green Background) */
    .image-box.online {
      background-color: #2ec4b6; /* Green Background */
      box-shadow: 0 0 25px rgba(46, 196, 182, 0.7); /* Glow effect */
    }

    /* Tasweer ki styling */
    .image-box img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }

    .status-text {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Tasweer aur uska background container -->
  <div class="image-box" id="imageBox">
    <img src="https://abdullah-gull.github.io/images/new-facon.jpg.png" alt="Profile">
  </div>

  <div class="status-text" id="statusText">Status: Checking...</div>

  <script>
    const imageBox = document.getElementById('imageBox');
    const statusText = document.getElementById('statusText');

    function updateTabStatus() {
      if (document.visibilityState === 'visible') {
        // Jab user ishi tab par ho (Green Background)
        imageBox.classList.add('online');
        statusText.innerText = "Status: Online (Active Tab)";
      } else {
        // Jab user doosre tab par chala jaye (Grey Background)
        imageBox.classList.remove('online');
        statusText.innerText = "Status: Offline (Inactive Tab)";
      }
    }

    // Page load hone par status set karein
    updateTabStatus();

    // Tab switch hone par event trigger hoga
    document.addEventListener('visibilitychange', updateTabStatus);
  </script>

</body>
</html>
