<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Favicon Status</title>
  
  <!-- Aapka Custom Favicon Link -->
  <link rel="icon" id="favicon" href="https://abdullah-gull.github.io/images/new-facon.jpg.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      transition: background-color 0.4s ease;
      background-color: white; /* Normal / Default Background */
    }

    /* Active Tab Background (Green) */
    body.online {
      background-color: #2ec4b6; 
      color: white;
    }

    .status-card {
      display: inline-block;
      padding: 20px 40px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.05);
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="status-card">
    Status: <span id="status-text">Checking...</span>
  </div>

  <script>
    const favicon = document.getElementById('favicon');

    // Aapka apna favicon link (Jab user tab par ho)
    const activeFavicon = "https://abdullah-gull.github.io/images/new-facon.jpg.png";
    
    // Offline hone par agar koi doosri image lagani ho toh uska link yahan dalein (Warna isko khali bhi chhod sakte hain)
    const inactiveFavicon = "https://abdullah-gull.github.io/images/new-facon.jpg.png"; // Ya koi doosra offline icon link

    function updateVisibility() {
      if (document.visibilityState === 'visible') {
        // Jab user isi tab par ho
        document.body.classList.add('online');
        document.getElementById('status-text').innerText = 'Online 🟢';
        document.title = "🟢 Aap Is Page Par Hain";
        favicon.href = activeFavicon;
      } else {
        // Jab user kisi doosre tab par chala jaye
        document.body.classList.remove('online');
        document.getElementById('status-text').innerText = 'Offline 🔴';
        document.title = "🔴 Wapas Aayein!";
        favicon.href = inactiveFavicon;
      }
    }

    // Page load hone par status set karein
    updateVisibility();

    // Tab visibility change hone par event listen karein
    document.addEventListener('visibilitychange', updateVisibility);
  </script>

</body>
</html>
