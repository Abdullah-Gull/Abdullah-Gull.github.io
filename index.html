<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Gull | Amazon Expert Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #D4AF37;
            --dark: #000000;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark); color: #fff; overflow-x: hidden; }

        /* --- HEADER (Ab ye scroll hoga upar) --- */
        .main-header { 
            position: relative; /* Fixed ki jagah relative lagaya taake scroll ho */
            width: 100%; 
            padding-top: 20px;
            z-index: 1000; 
            background: var(--dark);
        }

        .header-container {
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(15px);
            padding: 10px 25px; 
            border-radius: 100px; 
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .logo-text { font-weight: 700; font-size: 18px; color: #fff; text-decoration: none; }
        .logo-text span { color: var(--gold); }
        
        .nav-capsule { display: flex; background: var(--glass); padding: 5px; border-radius: 50px; gap: 5px; }
        .nav-link { color: #ccc; text-decoration: none; padding: 8px 18px; font-size: 14px; border-radius: 50px; transition: 0.3s; }
        .nav-link.active, .nav-link:hover { background: var(--gold); color: #000; font-weight: 600; }
        
        .get-in-touch-btn { text-decoration: none; color: #fff; border: 1.5px solid var(--gold); padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; transition: 0.3s; }
        .get-in-touch-btn:hover { background: var(--gold); color: #000; }

        /* --- HERO SECTION --- */
        .hero-split {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 8%;
            gap: 40px;
        }

        .hero-content h1 { font-size: 60px; line-height: 1.1; margin-bottom: 20px; }
        .hero-content h1 span { color: var(--gold); }
        .badge-gold { color: var(--gold); letter-spacing: 4px; font-weight: 800; margin-bottom: 10px; border-left: 3px solid var(--gold); padding-left: 10px; }
        .hero-subtext { color: #aaa; margin-bottom: 30px; font-size: 18px; }

        .btn-primary { background: var(--gold); color: #000; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 700; display: inline-block; }

        .image-wrapper img { width: 400px; border-radius: 20px; border: 1px solid var(--gold); }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="https://i.ibb.co/5h5KK51m/Abdullah-Gull.jpg" alt="Abdullah Gull">
                <a href="#" class="logo-text">Abdullah <span>Gull</span></a>
            </div>

            <nav class="nav-capsule">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="about.html" class="nav-link">About us</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="contact.html" class="nav-link">Contact us</a>
            </nav>

            <a href="meeting.html" class="get-in-touch-btn">Get In Touch</a>
        </div>
    </header>

    <section class="hero-split">
        <div class="hero-content">
            <div class="badge-gold">AMAZON FBA SPECIALIST</div>
            <h1>Building Brands<br><span>Scaling Amazon Success</span></h1>
            <p class="hero-subtext">PPC, Listing Optimization and Ranking Expert | SEO and Product Launch Experience.</p>
            <div class="hero-btns">
                <a href="services.html" class="btn-primary">Explore Services</a>
            </div>
        </div>
        
        <div class="hero-image-area">
            <div class="image-wrapper">
                <img src="https://i.ibb.co/5h5KK51m/Abdullah-Gull.jpg" alt="Abdullah Gull">
            </div>
        </div>
    </section>

</body>
</html>
