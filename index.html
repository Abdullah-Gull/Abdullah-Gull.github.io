    <style>
    :root {
        --gold: #D4AF37;

    * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Navigation */
header { 
    background: rgba(0, 0, 0, 0.85); 
    backdrop-filter: blur(10px); 
    padding: 15px 8% 25px; /* Upar niche barabar space */
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    position: sticky; 
    top: 0; 
    z-index: 1000; 
    border-radius: 0 0 60px 60px; 
    border-bottom: 2px solid var(--primary);
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo img { 
    width: 50px !important; 
    height: 50px !important; 
    border-radius: 50%; 
    border: 2px solid var(--primary); 
    object-fit: cover;
    object-position: top;
    display: block !important; /* Image ko force karne ke liye */
}

nav {
    display: flex;
    align-items: center;
    gap: 20px;
    /* Capsule Circle Design */
    background: rgba(255, 255, 255, 0.05); /* Halka glass effect */
    border: 1px solid rgba(255, 255, 255, 0.2); /* Barik border */
    padding: 8px 25px;
    border-radius: 50px; /* Is se capsule/circle shape banegi */
    backdrop-filter: blur(10px);
}

nav button {
    background: none;
    border: none;
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

/* Home ya active link ka color golden rakhne ke liye */
nav button.active, nav button:hover {
    color: #D4AF37; 
}

        /* Pages */
        .page { display: none; animation: fadeIn 0.5s ease; }
        .page.active { display: block; }

        .hero h2 { color: var(--primary); font-size: 18px; letter-spacing: 4px; margin-bottom: 10px; }
        .hero h1 { font-size: clamp(35px, 6vw, 65px); font-weight: 900; line-height: 1.1; }
        .hero p { max-width: 800px; margin: 20px auto; color: var(--text); font-size: 18px; }

        /* Logo Slider (Moving Marquee) */
        .logo-slider { background: #080808; padding: 40px 0; border-y: 1px solid #222; overflow: hidden; }
        .swiper-wrapper { transition-timing-function: linear !important; }
        .swiper-slide { width: auto; display: flex; align-items: center; padding: 0 50px; }
        .swiper-slide img { height: 45px; filter: brightness(0) invert(1); opacity: 0.7; transition: 0.4s; }
        .swiper-slide img:hover { opacity: 1; filter: none; }

        /* Sections */
        section { padding: 80px 8%; }
        .sec-title { font-size: 36px; font-weight: 900; margin-bottom: 40px; border-left: 8px solid var(--primary); padding-left: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card); padding: 35px; border-radius: 15px; border: 1px solid #222; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-10px); }
        .card h4 { color: var(--primary); margin-bottom: 15px; font-size: 20px; font-weight: 800; }

        /* Results Milestone */
        .milestone { background: var(--primary); color: #000; padding: 50px; border-radius: 20px; margin: 40px 0; }
        .milestone h3 { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .milestone p { font-size: 18px; font-weight: 700; }

        /* --- NEW PROPER FOOTER STYLING --- */
        .main-footer { background: #000; padding: 80px 8% 20px; border-top: 3px solid var(--primary); margin-top: 50px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; }
        .footer-col h4 { color: #fff; font-size: 16px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--primary); display: inline-block; padding-bottom: 5px; }
        .footer-col ul { list-style: none; }
        .footer-col li { color: #888; font-size: 14px; margin-bottom: 10px; transition: 0.3s; }
        .footer-col li:hover { color: var(--primary); }

        .footer-middle { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 40px; padding: 40px 0; border-top: 1px solid #111; border-bottom: 1px solid #111; margin-top: 50px; }
        .footer-box-title { font-weight: 700; color: #fff; margin-bottom: 15px; display: block; }
        
        .icon-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .ai-icon { width: 45px; height: 45px; background: #111; border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .soc-btn { width: 45px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; text-decoration: none; transition: 0.3s; }
        .fb-bg { background: #1877F2; }
        .li-bg { background: #0A66C2; }
        .in-bg { background: #E4405F; }
        .tk-bg { background: #000; border: 1px solid #333; }
        .sc-bg { background: #FFFC00; color: #000; }
        .soc-btn:hover { transform: translateY(-5px); filter: brightness(1.2); }

        .footer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; font-size: 12px; color: #555; }

        @media (max-width: 768px) { header { flex-direction: column; gap: 15px; } nav button { margin: 5px; } .footer-bottom { flex-direction: column; gap: 10px; text-align: center; } }
