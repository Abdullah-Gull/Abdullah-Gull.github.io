     <style>
    :root {
        --gold: #D4AF37;
        --dark: #000000;
        --glass: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--dark); color: #fff; overflow-x: hidden; }

    /* Floating Capsule Header */
    .main-header { position: fixed; top: 20px; width: 100%; z-index: 1000; }
    .header-container {
        max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between;
        align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
        padding: 10px 25px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1);
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-area img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); }
    .logo-text { font-weight: 700; font-size: 18px; }
    .logo-text span { color: var(--gold); }

    .nav-capsule { display: flex; background: var(--glass); padding: 5px; border-radius: 50px; gap: 5px; }
    .nav-link { color: #ccc; text-decoration: none; padding: 8px 18px; font-size: 14px; border-radius: 50px; transition: 0.3s; }
    .nav-link.active, .nav-link:hover { background: var(--gold); color: #000; font-weight: 600; }

    .get-in-touch-btn { 
        text-decoration: none; color: #fff; border: 1.5px solid var(--gold); 
        padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; transition: 0.3s;
    }
    .get-in-touch-btn:hover { background: var(--gold); color: #000; }

    /* About Section Preview */
    .about-preview { padding: 120px 10% 80px; display: flex; align-items: center; gap: 50px; }
    .about-content h1 { font-size: 45px; margin-bottom: 20px; }
    .about-content p { color: #aaa; line-height: 1.6; margin-bottom: 30px; }
         /* --- Hero Split Layout --- */
.hero-split {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    gap: 40px;
    background: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
}

.hero-content { flex: 1; max-width: 650px; }

.badge-gold {
    color: var(--gold);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 20px;
    border-left: 3px solid var(--gold);
    padding-left: 15px;
}

.hero-content h1 {
    font-size: 60px;
    line-height: 1.1;
    font-weight: 800;
    margin-bottom: 25px;
}

.hero-content h1 span {
    color: var(--gold);
    display: block;
}

.hero-subtext {
    font-size: 18px;
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 40px;
    border-left: 1px solid rgba(255,255,255,0.1);
    padding-left: 20px;
}

.hero-btns { display: flex; gap: 20px; }

.btn-primary {
    background: var(--gold);
    color: #000;
    padding: 16px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
    box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
}

.btn-secondary {
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 16px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4); }
.btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: #fff; }

/* --- Image Area Styling --- */
.hero-image-area { flex: 0.8; position: relative; display: flex; justify-content: flex-end; }

.image-wrapper { position: relative; width: 400px; height: 500px; }

.image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 30px;
    border: 1px solid rgba(212, 175, 55, 0.3);
}

.experience-badge {
    position: absolute;
    bottom: -20px;
    left: -30px;
    background: #111;
    border: 1px solid var(--gold);
    padding: 20px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    backdrop-filter: blur(10px);
}

.years { font-size: 35px; font-weight: 900; color: var(--gold); }
.exp-text { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #fff; line-height: 1.2; }

/* Responsive */
@media (max-width: 992px) {
    .hero-split { flex-direction: column; text-align: center; padding-top: 150px; }
    .hero-image-area { margin-top: 50px; justify-content: center; }
    .hero-btns { justify-content: center; }
    .badge-gold { border-left: none; padding-left: 0; }
    .hero-subtext { border-left: none; padding-left: 0; }
}
